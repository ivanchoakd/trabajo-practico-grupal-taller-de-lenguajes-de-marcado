<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/estilos.css" />
    <title>Contacto</title>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark navbar_reboot">
        <div class="container-fluid">
          <a class="navbar-brand" href="index.html">
            <img
              class="logo"
              src="imagenes/reboot_social_logo.png"
              alt="Logo de Reboot Social"
            />
            <h1 class="titulo_sitio mb-0">Reboot Social</h1>
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#nav_principal"
            aria-controls="nav_principal"
            aria-expanded="false"
            aria-label="Mostrar navegación"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="nav_principal">
            <ul class="navbar-nav mx-auto">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Inicio</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="nosotros.html">Nuestra historia</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="programas.html">Programas</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="contacto.html">Contacto</a>
              </li>
            </ul>
          </div>
          <button
            id="btn_modo_oscuro"
            class="btn btn-outline-light btn_modo_oscuro"
            type="button"
          >
            🌙
          </button>
        </div>
      </nav>
    </header>
    <main>
      <section id="encuentranos">
        <h2>Encuéntranos en nuestra sede</h2>
        <a
          href="https://maps.app.goo.gl/ggtCFAtvBjFVR33N8"
          target="_blank"
          rel="noopener noreferrer"
          >Av del libertador 2932 CABA</a
        >
      </section>
      <section id="horarios">
        <h2>Horario de atención</h2>
        <p>Lunes a viernes de 9 a 18 hs.</p>
      </section>
      <section id="contactanos">
        <h2>Contáctanos</h2>
        <a href="mailto:rebootsocial@org.ar">
          <img src="imagenes/mail.png" alt="Logo de correo electrónico"
        /></a>
        <a href="tel:+541143218765">
          <img src="imagenes/telefono.png" alt="Logo de teléfono"
        /></a>
        <a href="https://instagram.com" target="_blank" rel="noopener noreferrer"
          ><img src="imagenes/ig.png" alt="Logo de Instagram"
        /></a>
      </section>
      <section id="formulario">
        <h2>Sumate o hacé una consulta</h2>
        <form class="formulario_contacto">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" required />

          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />

          <label for="motivo">Motivo</label>
          <select id="motivo" name="motivo">
            <option value="donar">Donar un equipo</option>
            <option value="voluntario">Ser voluntario</option>
            <option value="consulta">Consulta general</option>
          </select>

          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" rows="4" required></textarea>

          <button type="submit" class="btn btn-primary">Enviar</button>
          <p class="mensaje_confirmacion" id="mensaje_confirmacion"></p>
        </form>
      </section>
    </main>
    <footer><small>©2026 Reboot Social</small></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
